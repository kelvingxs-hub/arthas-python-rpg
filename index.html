<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿尔萨斯 Python RPG 第一章</title><style>body{background:#14212c;color:#fff0c8;text-align:center;font-family:system-ui;margin:0}h2{font-size:22px}svg{width:96%;max-width:640px;border:4px solid #b89858;border-radius:12px}button{font-size:19px;background:#8d683b;color:white;padding:13px;border-radius:10px;border:1px solid #d2b67c;touch-action:manipulation}#pad{display:grid;grid-template-columns:65px 65px 65px;gap:5px;justify-content:center;margin:10px}#msg{padding:14px;min-height:50px}#modal{display:none;position:fixed;inset:12% 5%;background:#203445;border:3px solid #c5a56c;border-radius:14px;padding:15px}input{font-size:18px;padding:10px;max-width:85%}</style><h2>⚔️ 阿尔萨斯：洛丹伦的黎明</h2><p>❤️100　⭐等级 <b id="level">1</b>　🪙<b id="coins">0</b></p><svg viewBox="0 0 600 370"><rect width="600" height="370" fill="#668c63"/><path d="M0 255 Q200 170 600 245" fill="none" stroke="#d8c296" stroke-width="85"/><rect x="30" y="60" width="180" height="140" rx="7" fill="#8796a9" stroke="#425672" stroke-width="7"/><path d="M20 60L120 0L220 60" fill="#435b78"/><rect x="50" y="24" width="30" height="75" fill="#bac7d1"/><rect x="170" y="24" width="30" height="75" fill="#bac7d1"/><path d="M110 200v-55q20-35 40 0v55" fill="#334659"/><g fill="#315c40"><path d="M370 130l35-95 35 95z"/><path d="M430 135l35-100 35 100z"/><path d="M500 125l35-90 35 90z"/></g><g transform="translate(290 165)"><circle cy="-22" r="14" fill="#f1cda5"/><path d="M-18 -5h36l7 43h-50z" fill="#d7b85c"/><text y="-46" text-anchor="middle" fill="white">乌瑟尔</text></g><g transform="translate(490 275)"><circle cy="-22" r="14" fill="#f1cda5"/><path d="M-18 -5h36l12 43h-60z" fill="#5a7bc4"/><text y="-46" text-anchor="middle" fill="white">吉安娜</text></g><g id="hero"><circle cy="-22" r="14" fill="#f3d4b2"/><path d="M-16 -6h32l8 37h-48z" fill="#4a72af" stroke="#ddbc6b" stroke-width="4"/><path d="M21 9l25-32" stroke="#e8e8e8" stroke-width="5"/><text y="-48" text-anchor="middle" fill="white">阿尔萨斯</text></g><circle id="light" cx="-90" cy="-90" r="40" fill="#ffe98c" opacity="0"/></svg><div id="msg">第一章：靠近乌瑟尔，接受 Python 的第一课。</div><button id="talk">💬 互动/任务</button> <button id="skill">✨ 圣光</button> <button id="bag">🎒 背包</button><div id="pad"><span></span><button data-d="up">▲</button><span></span><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div id="modal"><h2 id="title"></h2><div id="body"></div><p><button id="close">关闭</button></p></div><script>let x=155,y=270,stage=0,coins=0;try{let s=JSON.parse(localStorage.getItem('arthas-game')||'null');if(s){stage=s.stage;coins=s.coins}}catch(e){}const $=id=>document.getElementById(id);function render(){$('hero').setAttribute('transform',`translate(${x} ${y})`);$('coins').textContent=coins;$('level').textContent=stage===2?2:1}function save(){try{localStorage.setItem('arthas-game',JSON.stringify({stage,coins}))}catch(e){}}function move(d){if(d==='up')y-=18;if(d==='down')y+=18;if(d==='left')x-=18;if(d==='right')x+=18;x=Math.max(20,Math.min(580,x));y=Math.max(65,Math.min(335,y));render()}document.querySelectorAll('[data-d]').forEach(b=>{let timer;b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.d);timer=setInterval(()=>move(b.dataset.d),140)});for(let n of ['pointerup','pointercancel','pointerleave'])b.addEventListener(n,()=>clearInterval(timer))});function say(s){$('msg').textContent=s}function show(t,b){$('title').textContent=t;$('body').innerHTML=b;$('modal').style.display='block'}$('close').onclick=()=>$('modal').style.display='none';$('talk').onclick=()=>{if(Math.hypot(x-290,y-165)<110){if(stage===0){show('乌瑟尔：第一课','输入 Python 指令，显示 Hello, Lordaeron!<p>提示：print("Hello, Lordaeron!")</p><input id="ans" placeholder="输入 Python 指令"><p><button id="submit">执行</button></p>');$('submit').onclick=()=>{if($('ans').value.includes('print(')&&$('ans').value.includes('Hello, Lordaeron!')){stage=1;coins+=10;save();render();show('成功！','你学会了 print()，获得 10 金币。去找吉安娜！');say('去找吉安娜继续学习。')}else say('指令不正确，请检查拼写、引号和括号。')}}else show('乌瑟尔','去找吉安娜继续冒险。')}else if(Math.hypot(x-490,y-275)<100){if(stage===1){show('吉安娜：变量','把数字 7 存入 mana 变量。<p>提示：mana = 7</p><input id="ans" placeholder="输入代码"><p><button id="submit">执行</button></p>');$('submit').onclick=()=>{if($('ans').value.replaceAll(' ','')==='mana=7'){stage=2;coins+=20;save();render();show('第一章完成！','你学会了 print() 和变量！获得 20 金币，升到等级 2。');say('🎉 第一章完成！')}else say('再试一次：mana = 7')}}else show('吉安娜',stage===0?'先去找乌瑟尔。':'恭喜你完成第一章！')}else say('请走近乌瑟尔或吉安娜再互动。')};$('skill').onclick=()=>{let l=$('light');l.setAttribute('cx',x);l.setAttribute('cy',y);l.setAttribute('opacity','.8');say('✨ 圣光闪耀！');setTimeout(()=>l.setAttribute('opacity','0'),450)};$('bag').onclick=()=>show('背包','⚔️ 训练长剑<br>🛡️ 学徒护甲<br>🪙 '+coins+' 金币');render();</script></html>
